name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx run ruff==0.17.3 check --output-format=github .
      - run: pipx run ruff==0.17.3 format --check .

  metadata:
    name: Validate desktop and AppStream files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq appstream desktop-file-utils
      - run: appstreamcli validate --no-net --explain data/io.github.rene_langer.KanshiEditor.metainfo.xml
      - run: desktop-file-validate data/io.github.rene_langer.KanshiEditor.desktop

  test:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04          # oldest supported libadwaita (1.5)
          - debian:trixie
          - registry.fedoraproject.org/fedora:latest
          - archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - run: sh packaging/ci/install-deps.sh
      - name: Unit and window tests
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1400x900x24" python3 -m unittest discover -s tests -t . -v

  build:
    name: Packages
    needs: [lint, metadata, test]
    uses: ./.github/workflows/build.yml
