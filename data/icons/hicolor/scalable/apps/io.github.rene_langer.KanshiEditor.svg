<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screenA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="screenB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
  </defs>
  <!-- stands -->
  <rect x="38" y="86" width="12" height="16" fill="#9a9996"/>
  <rect x="24" y="100" width="40" height="8" rx="4" fill="#77767b"/>
  <rect x="92" y="98" width="10" height="6" fill="#9a9996"/>
  <rect x="82" y="102" width="30" height="8" rx="4" fill="#77767b"/>
  <!-- landscape monitor -->
  <rect x="6" y="28" width="78" height="60" rx="6" fill="url(#bezel)"/>
  <rect x="11" y="33" width="68" height="50" rx="2" fill="url(#screenA)"/>
  <path d="M11 69 L33 52 L49 64 L61 56 L79 70 V83 H11 Z" fill="#ffffff" opacity="0.18"/>
  <!-- portrait monitor -->
  <rect x="78" y="16" width="44" height="84" rx="6" fill="url(#bezel)"/>
  <rect x="83" y="21" width="34" height="74" rx="2" fill="url(#screenB)"/>
  <rect x="88" y="30" width="24" height="3" rx="1.5" fill="#ffffff" opacity="0.5"/>
  <rect x="88" y="37" width="18" height="3" rx="1.5" fill="#ffffff" opacity="0.5"/>
  <rect x="88" y="44" width="21" height="3" rx="1.5" fill="#ffffff" opacity="0.5"/>
  <!-- move cursor -->
  <g transform="translate(44 58)">
    <circle r="15" fill="#ffffff" opacity="0.95"/>
    <path d="M0 -10 L4 -5 H1.5 V-1.5 H5 V-4 L10 0 L5 4 V1.5 H1.5 V5 H4 L0 10 L-4 5 H-1.5 V1.5 H-5 V4 L-10 0 L-5 -4 V-1.5 H-1.5 V-5 H-4 Z" fill="#241f31"/>
