# File header: kanshi profiles.
# Keep this comment at the top.

include ~/.config/kanshi/config.d/*

output "Acme Wide 0001" alias $desk
output eDP-1 scale 1.5

# Desk: two monitors.
# The wide one is on the left.
profile desk {
    output $desk                       mode 3440x1440 position 0,0   scale 1
    output "Acme Tall 0002" mode 1920x1080@60Hz position 3440,0 transform 90  # portrait
    output eDP-1 disable
    exec $HOME/.local/bin/wallpaper reload
}

profile docked {
	output eDP-1 enable mode 2880x1800@120Hz position 0,0
	output "*" enable position 1920,0
}

profile block-form {
    output "Some Company ASDF 4242" {
        mode 1600x900
        # inside a block
        position 0,0
    }
    ...output "*" enable
}

profile { output LVDS-1 enable scale 2 }

profile "quoted name" {
    output HDMI-A-1 mode --custom 1280x720@60Hz
    exec swaymsg workspace 1, move workspace to output '"Some Other Company GTBZ 2525"'  # not a comment
    future_directive with "some args"
}

# trailing comment
